<div class="row g-5 mb-5">
   <div class="row g-5 mb-5">
     <div class="col-md-6">
       <h4>{{ contact.name }}</h4>
       <p>{{ contact.title }} | {{ contact.department }}</p>
       <p>{{ contact.institution }} | {{ contact.institution_address }}</p>
       <p>{{ contact.email }}</p>
       <p>{{ contact.github }}</p>
       <p>{{ contact.linkedin }} </p>
     </div>
     <div class="col-md-6">
       <img src="{{ site.github.url }}/{{ contact.image }}" alt="Contact" width="70%">
     </div>
   </div>
   {% endfor %}
 </div>
</div>
